<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本信息表单</title>
</head>
<body>
    <form action=""></form>
        <table border="1" cellspacing="0" cellpadding="7" align="center">
            <caption>
                <h3>基本信息表单</h3>
            </caption>
            <tr>
                <td bgcolor="#ffb2bc" align="right">姓名：</td>
                <td>
                    <input type="text" placeholder="请输入用户名">
                </td>
            </tr>
            <tr>
                <td bgcolor="#ffb2bc" align="right">性别：</td>
                <td>
                    <input type="radio" name="six" >男
                    <input type="radio" name="six" checked>女
                </td>
            </tr>
            <tr>
                <td  align="right" bgcolor="#ffb2bc">密码：</td>
                <td>
                    <input type="text" placeholder="请输入密码">
                </td>
            </tr>
            <tr>
                <td align="right" bgcolor="#ffb2bc">籍贯：</td>
                <td>
                    <input type="text" placeholder="请输入户口所在地">
                </td>
            </tr>
            <tr>
                <td align="right" bgcolor="#ffb2bc">生源地：</td>
                <td>
                    <select name="" id="">
                        <option value="">保定</option>
                        <option value="">沧州</option>
                        <option value="" selected>石家庄</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td align="right" bgcolor="#ffb2bc">兴趣爱好：</td>
                <td>
                    <input type="checkbox">篮球
                    <input type="checkbox">足球
                    <input type="checkbox">跳舞
                    <input type="checkbox">唱歌
                    <input type="checkbox" checked>游泳
                    <input type="checkbox">说唱
                </td>
            </tr>
            <tr>
                <td align="right" bgcolor="#ffb2bc">自我介绍：</td>
                <td>
                    <textarea name="8" id="88" cols="60" rows="6"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="请提交">
                    <input type="reset" value="请重置">
                </td>
            </tr>
            </table>
    
    </form>
</body>
</html>
